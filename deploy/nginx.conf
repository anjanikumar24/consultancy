server {
    listen 80;
    server_name bhumipathwaysconsultancy.com www.bhumipathwaysconsultancy.com;
    # Certbot adds the HTTPS server block and the redirect.

    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /static/ { alias /srv/bhumi/staticfiles/; expires 30d; }
    location / {
        include proxy_params;               # sets X-Forwarded-For / Host
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://unix:/run/bhumi/gunicorn.sock;
    }
}
